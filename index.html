<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#012d1d" />
    <meta name="description" content="Al Mustafa Academy — Bridging Tradition & Excellence. A world-class Islamic school nurturing souls and educating minds since 1998." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Al Mustafa" />
    <title>Al Mustafa Academy | Bridging Tradition & Excellence</title>
    <link rel="icon" type="image/png" href="/app-icon-192.png" />
    <link rel="apple-touch-icon" href="/app-icon-192.png" />

    <!-- Load web fonts up-front (preconnect + render-blocking stylesheet instead of a
         CSS @import) so text paints with the real fonts — no fallback-font flash. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" />

    <style>
      /* Branded boot splash — inline so it paints before any external CSS loads.
         It covers the empty #root while the JS bundle downloads and fades out
         only when the real content is on screen: no white frame and no flash of
         fallback/default content, on any visit. */
      #boot-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
        background: #012d1d;
        color: #f7d44a;
        font-family: Georgia, "Times New Roman", serif;
        transition: opacity 0.25s ease-out;
      }
      #boot-splash.hide { opacity: 0; pointer-events: none; }
      #boot-splash .ring {
        width: 44px; height: 44px; border-radius: 50%;
        border: 3px solid rgba(247, 212, 74, 0.25);
        border-top-color: #f7d44a;
        animation: ama-boot-spin 0.9s linear infinite;
      }
      @keyframes ama-boot-spin { to { transform: rotate(360deg); } }
      #boot-splash .brand { font-size: 16px; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.9; }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .ring { animation-duration: 3s; }
      }
    </style>

    <!--
      Blocking pre-paint bootstrap — eliminates the Flash of Unstyled/Default Content.
      Runs synchronously BEFORE the app bundle, so the very first frame already carries
      the last-known site content theme, typography, and Style-Editor custom styles
      (read from a local snapshot). First paint is always gated: repeat visits reveal
      the snapshot content the moment React mounts; first visits reveal only when real
      content arrives — the boot splash covers the screen either way, so fallback
      content can never be seen.
    -->
    <script>
      (function () {
        var KEY = "ama_site_snapshot_v1";
        var VARS = {
          color_primary: "--color-primary",
          color_primary_hover: "--color-primary-hover",
          color_secondary: "--color-secondary",
          color_secondary_hover: "--color-secondary-hover",
          color_secondary_fixed: "--color-secondary-fixed",
          color_secondary_container: "--color-secondary-container",
          font_heading: "--font-serif",
          font_body: "--font-sans",
          heading_size_h1: "--heading-size-h1",
          heading_size_h2: "--heading-size-h2",
          heading_size_h3: "--heading-size-h3",
          body_text_size: "--body-text-size",
          line_height_body: "--line-height-body",
          letter_spacing_headings: "--letter-spacing-headings",
        };
        var root = document.documentElement;
        // Always gate the first paint. The app calls revealApp() the moment real
        // content (or the snapshot) is on screen; the splash covers the gap.
        root.setAttribute("data-ama-boot", "1");
        try {
          var raw = localStorage.getItem(KEY);
          if (raw) {
            var snap = JSON.parse(raw);
            var content = snap && snap.content ? snap.content : null;
            if (content) {
              var cssText = "";
              for (var k in VARS) {
                var v = (content[k] || "").trim();
                if (!v) continue;
                if (k.indexOf("color_") === 0 && !/^#[0-9a-fA-F]{6}$/.test(v)) continue;
                cssText += VARS[k] + ":" + v + ";";
              }
              if (cssText) document.documentElement.style.cssText += cssText;

              // Convert saved Style-Editor rules into real CSS so margins, padding,
              // colors, fonts, etc. are applied from the very first frame.
              var cs = content.custom_styles;
              if (cs) {
                try {
                  var map = JSON.parse(cs);
                  var css = "";
                  for (var sel in map) {
                    var props = map[sel];
                    if (!props || typeof props !== "object") continue;
                    var decl = "";
                    for (var prop in props) {
                      var val = String(props[prop]).trim();
                      if (!val) continue;
                      decl += prop.replace(/[A-Z]/g, function (m) { return "-" + m.toLowerCase(); }) + ":" + val + ";";
                    }
                    if (decl) css += sel + "{" + decl + "}";
                  }
                  if (css) {
                    var el = document.createElement("style");
                    el.id = "ama-boot-styles";
                    el.textContent = css;
                    document.head.appendChild(el);
                  }
                } catch (e) {}
              }
              return; // snapshot present → React reveals as soon as it mounts
            }
          }
        } catch (e) {}
        // Last-resort safety: if the JS bundle never loads, don't leave the page
        // stuck behind the gate. Kept long (10s) so a slow bundle can never reveal
        // fallback content before the real content arrives.
        setTimeout(function () {
          root.setAttribute("data-ama-ready", "1");
        }, 10000);
      })();
    </script>
  </head>
  <body>
    <div id="boot-splash"><div class="ring"></div><div class="brand">Al Mustafa Academy</div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
